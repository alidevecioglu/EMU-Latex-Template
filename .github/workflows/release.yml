name: Release thesis PDF

# Builds the thesis with the exact same compile.sh used locally, then
# publishes a numbered GitHub Release with "<title>-vN.pdf" attached, so
# there's always a downloadable "latest passing build" without anyone
# running compile.sh by hand and uploading it themselves.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install poppler-utils
        # compile.sh needs pdfinfo/pdfseparate/pdfunite for the cover-page
        # extraction; the texlive image doesn't include them by default.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends poppler-utils

      - name: Build PDF
        run: |
          chmod +x compile.sh
          ./compile.sh

      - name: Rename full thesis PDF with a version number
        id: meta
        run: |
          set -Eeuo pipefail
          VERSION="v${{ github.run_number }}"

          # Discover what compile.sh actually produced instead of
          # reconstructing the filename from \title{...} a second time
          # (that duplication is exactly what broke this before: this step
          # used to derive its own, less-sanitized copy of the title and
          # produce a filename that didn't match the one compile.sh wrote).
          COVER_PDF="$(find . -maxdepth 1 -name '* - Cover-Approval.pdf' -printf '%f\n')"
          FULL_PDF="$(find . -maxdepth 1 -name '*.pdf' ! -name '* - Cover-Approval.pdf' -printf '%f\n')"

          [ -n "$COVER_PDF" ] || { echo "::error::Cover-Approval PDF not found after compile.sh"; exit 1; }
          [ -n "$FULL_PDF" ] || { echo "::error::Full thesis PDF not found after compile.sh"; exit 1; }
          [ "$(printf '%s\n' "$FULL_PDF" | wc -l)" -eq 1 ] || { echo "::error::Expected exactly one non-cover PDF, found: $FULL_PDF"; exit 1; }

          RELEASE_PDF="${FULL_PDF%.pdf}-${VERSION}.pdf"
          mv -- "$FULL_PDF" "$RELEASE_PDF"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_pdf=$RELEASE_PDF" >> "$GITHUB_OUTPUT"
          echo "cover_pdf=$COVER_PDF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: "Thesis build ${{ steps.meta.outputs.version }}"
          files: |
            ${{ steps.meta.outputs.release_pdf }}
            ${{ steps.meta.outputs.cover_pdf }}
